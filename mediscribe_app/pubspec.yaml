name: mediscribe_app
description: "AI-powered medical prescription digitization app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.0.4
  google_mlkit_text_recognition: ^0.13.0
  flutter_image_compress: ^2.2.0

  http: ^1.2.0
  flutter_dotenv: ^5.1.0

  pdf: ^3.10.7
  barcode: ^2.2.9
  bidi: ^2.0.13
  path_provider: ^2.1.2
  share_plus: ^7.2.2

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env
